name: Integrate Game Juice and Ambient VFX

on:
  push:
    branches:
      - feat/effects-game-juice-integration
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/effects-game-juice-integration
          fetch-depth: 0
      - name: Apply Game Juice and AmbientFX patch against current main
        shell: bash
        run: |
          set -euo pipefail
          PATCH="web/files/0002-feat-vfx-7-Game-Juice-effects-wobble-hop-jitter-spee.patch"
          git apply --3way --check "$PATCH"
          git apply --3way "$PATCH"
          git status --short
      - name: Validate effects modules and regression tests
        working-directory: web
        run: |
          set -euo pipefail
          node --version
          node --check game/vfx/effects/EffectDirector.mjs
          node --check game/vfx/effects/effectLibrary.mjs
          node --check game/vfx/effects/effectPreview.mjs
          node --check game/vfx/effects/AmbientFX.mjs
          node --test tests/effect-library.test.mjs tests/effect-director.test.mjs tests/effect-juice.test.mjs tests/effect-ambient.test.mjs
      - name: Commit integrated changes
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "feat(vfx): add game juice layers and ambient stage effects"
            git push origin HEAD:feat/effects-game-juice-integration
          else
            echo "No changes to commit."
          fi
