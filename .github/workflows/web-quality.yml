name: Web quality gate

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "Documentation/GAME_DEVELOPMENT_ROADMAP.md"
      - ".github/workflows/web-quality.yml"
  pull_request:
    paths:
      - "web/**"
      - "Documentation/GAME_DEVELOPMENT_ROADMAP.md"
      - ".github/workflows/web-quality.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run Phase 1 gameplay tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
