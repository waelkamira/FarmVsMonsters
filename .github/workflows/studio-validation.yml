name: Studio and Game Validation

on:
  push:
    branches:
      - feat/studio-sprite-frame-count
      - feat/studio-hybrid-animation-engine
      - feat/studio-hybrid-animation-engine-mainline
  workflow_dispatch:
  pull_request:
    paths:
      - "web/app/studio/**"
      - "web/app/api/studio/**"
      - "web/game/studio/**"
      - "web/game/scenes/BattleScene.js"
      - "web/tests/**"
      - "web/package.json"
      - "web/package-lock.json"
      - ".github/workflows/studio-validation.yml"

permissions:
  contents: read

concurrency:
  group: studio-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Tests, lint, and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run focused Studio foundation tests
        run: >-
          node --test
          tests/studio-local-registry-store.test.mjs
          tests/studio-reviewed-release-flow.test.mjs
          tests/studio-asset-dependencies.test.mjs
          tests/studio-asset-readiness.test.mjs
          tests/studio-release-lifecycle.test.mjs
          tests/studio-hybrid-engine-integration.test.mjs
          tests/studio-clone-dialog.test.mjs
          tests/studio-asset-versions.test.mjs
      - name: Run full unit suite
        if: always()
        run: npm test
      - name: Run ESLint
        if: always()
        run: npm run lint
      - name: Build production application
        if: always()
        run: npm run build
