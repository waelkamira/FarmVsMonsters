name: Auto-Rig subsystem validation

on:
  push:
    branches:
      - feat/studio-ai-auto-rig-builder
  pull_request:
    paths:
      - "web/app/studio/**"
      - "web/app/api/studio/assets/route.js"
      - "web/app/api/studio/auto-rig/worker/route.js"
      - "web/game/studio/**"
      - "web/local-ai-worker/**"
      - "web/game/studio/autoRigWorkerProtocol.mjs"
      - "web/tests/studio-auto-rig-worker-protocol.test.mjs"
      - "web/tests/studio-auto-rig-worker-route.test.mjs"
      - "web/tests/studio-auto-rig-publish-gate.test.mjs"
      - "web/tests/studio-rig-library.test.mjs"
      - "web/tests/studio-clone-dialog.test.mjs"
      - "web/tests/studio-auto-rig-builder.test.mjs"
      - "web/tests/studio-asset-versions.test.mjs"
      - "web/tests/studio-hybrid-engine-integration.test.mjs"
      - "web/package.json"
      - "web/package-lock.json"
      - ".github/workflows/auto-rig-validation.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Auto-Rig, quality-validator, and Studio contract tests
        run: node --test tests/studio-auto-rig-builder.test.mjs tests/studio-auto-rig-worker-protocol.test.mjs tests/studio-auto-rig-worker-route.test.mjs tests/studio-auto-rig-publish-gate.test.mjs tests/studio-rig-library.test.mjs tests/studio-clone-dialog.test.mjs tests/studio-asset-versions.test.mjs tests/studio-hybrid-engine-integration.test.mjs

      - name: Run focused Auto-Rig ESLint
        run: npx eslint app/studio/AutoRigBuilderPanel.jsx app/api/studio/assets/route.js app/api/studio/auto-rig/worker/route.js game/studio/autoRigBuilder.mjs game/studio/autoRigWorkerProtocol.mjs game/studio/assetVersions.mjs

      - name: Run full-project ESLint diagnostics
        run: npm run lint
        continue-on-error: true

      - name: Build production application
        run: npm run build

  validate-local-ai-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/local-ai-worker
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install worker test dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate WSL launcher syntax
        run: bash -n setup-wsl.sh start-worker-wsl.sh
      - name: Compile worker
        run: python -m py_compile worker.py
      - name: Run worker contract tests
        run: python -m unittest -v test_worker.py
