name: Auto-Rig subsystem validation

on:
  workflow_dispatch:
  push:
    branches:
      - feat/studio-ai-auto-rig-builder
  pull_request:
    paths:
      - "web/app/studio/**"
      - "web/app/api/studio/assets/route.js"
      - "web/app/api/studio/auto-rig/worker/route.js"
      - "web/game/studio/**"
      - "web/game/scenes/BattleScene.js"
      - "web/local-ai-worker/**"
      - "web/game/studio/autoRigWorkerProtocol.mjs"
      - "web/tests/studio-auto-rig-worker-protocol.test.mjs"
      - "web/tests/studio-auto-rig-worker-route.test.mjs"
      - "web/tests/studio-auto-rig-publish-gate.test.mjs"
      - "web/tests/studio-rig-library.test.mjs"
      - "web/tests/studio-clone-dialog.test.mjs"
      - "web/tests/studio-auto-rig-builder.test.mjs"
      - "web/tests/studio-semantic-role-classifier.test.mjs"
      - "web/local-ai-worker/test_visual_semantic_classifier.py"
      - "web/local-ai-worker/test_generative_anatomical_reconstruction.py"
      - "web/local-ai-worker/real_asset_smoke_test.py"
      - "web/tests/studio-rig-template-retarget.test.mjs"
      - "web/tests/studio-auto-rig-reconstruction-ui.test.mjs"
      - "web/tests/studio-asset-versions.test.mjs"
      - "web/tests/studio-hybrid-engine-integration.test.mjs tests/studio-battle-rig-runtime.test.mjs"
      - "web/tests/studio-battle-rig-runtime.test.mjs"
      - "web/package.json"
      - "web/package-lock.json"
      - ".github/workflows/auto-rig-validation.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Auto-Rig, quality-validator, and Studio contract tests
        run: node --test tests/studio-auto-rig-builder.test.mjs tests/studio-semantic-role-classifier.test.mjs tests/studio-rig-template-retarget.test.mjs tests/studio-auto-rig-reconstruction-ui.test.mjs tests/studio-auto-rig-worker-protocol.test.mjs tests/studio-auto-rig-worker-route.test.mjs tests/studio-auto-rig-publish-gate.test.mjs tests/studio-rig-library.test.mjs tests/studio-clone-dialog.test.mjs tests/studio-asset-versions.test.mjs tests/studio-hybrid-engine-integration.test.mjs

      - name: Run focused Auto-Rig ESLint
        run: npx eslint app/studio/AutoRigBuilderPanel.jsx app/api/studio/assets/route.js app/api/studio/auto-rig/worker/route.js game/studio/autoRigBuilder.mjs game/studio/semanticRoleClassifier.mjs game/studio/rigTemplateRetarget.mjs game/studio/autoRigWorkerProtocol.mjs game/studio/assetVersions.mjs

      - name: Run full-project ESLint diagnostics
        run: npm run lint
        continue-on-error: true

      - name: Build production application
        run: npm run build

  validate-local-ai-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/local-ai-worker
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install worker test dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate WSL launcher syntax
        run: bash -n setup-wsl.sh start-worker-wsl.sh
      - name: Compile worker
        run: python -m py_compile worker.py smoke_test.py visual_semantic_classifier.py generative_anatomical_reconstruction.py real_asset_smoke_test.py
      - name: Run worker contract tests
        run: python -m unittest -v test_worker.py test_smoke_test.py test_visual_semantic_classifier.py test_generative_anatomical_reconstruction.py

  # Expensive model download is opt-in through the PR body marker or workflow_dispatch.
  validate-real-asset-inference:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[real-asset-smoke]')) || (github.event_name == 'pull_request' && contains(github.event.pull_request.body, '<!-- run-real-asset-smoke -->'))
    needs: validate-local-ai-worker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web/local-ai-worker
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install local SAM 2 and CLIP models with checkpoint verification
        run: bash setup-wsl.sh
      - name: Run real-asset segmentation and visual role classification
        run: |
          source "$HOME/.venvs/fvm-studio-ai/bin/activate"
          export SAM2_CONFIG="$HOME/.cache/fvm-sam2/configs/sam2.1/sam2.1_hiera_t.yaml"
          export SAM2_CHECKPOINT="$HOME/models/sam2.1_hiera_tiny.pt"
          export FVM_CLIP_MODEL_DIR="$HOME/models/clip-vit-base-patch32"
          python real_asset_smoke_test.py --output-dir auto-rig-real-asset-results | tee auto-rig-real-asset-results.json
      - name: Upload real-asset visual report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auto-rig-real-asset-inference
          path: |
            web/local-ai-worker/auto-rig-real-asset-results/
            web/local-ai-worker/auto-rig-real-asset-results.json
          if-no-files-found: warn
