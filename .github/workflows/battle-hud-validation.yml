name: Battle HUD validation

on:
  pull_request:
    branches: [main]
    paths:
      - "web/game/scenes/BattleScene.js"
      - "web/game/scenes/BattleHudButtons.js"
      - "web/tests/wood-frame-inventory.test.mjs"
      - "web/tests/battle-hud-buttons-layout.test.mjs"
      - "web/tests/studio-ui-layout.test.mjs"
      - "web/tests/studio-plant-projectile-profile.test.mjs"
      - "web/app/studio/**"
      - ".github/workflows/battle-hud-validation.yml"

permissions:
  contents: read

concurrency:
  group: battle-hud-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Focused HUD, Studio lint, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Lint changed gameplay and Studio files
        run: npx eslint game/scenes/BattleScene.js game/scenes/BattleHudButtons.js tests/battle-hud-buttons-layout.test.mjs tests/wood-frame-inventory.test.mjs app/studio/ProjectileTrajectoryEditor.jsx app/studio/RigEditor.jsx app/studio/page.js game/studio/plantProfiles.mjs tests/studio-ui-layout.test.mjs tests/studio-plant-projectile-profile.test.mjs
      - name: Verify centralized battle HUD layout
        run: node --test tests/battle-hud-buttons-layout.test.mjs
      - name: Verify battle HUD integration regressions
        run: node --test --test-name-pattern="all battle action buttons|uploaded wood frame is loaded" tests/wood-frame-inventory.test.mjs
      - name: Verify stage roster and encounter integration
        run: node --test tests/stage-encounter-controls.test.mjs
      - name: Verify Studio viewport and projectile profile regressions
        run: node --test tests/studio-ui-layout.test.mjs tests/studio-plant-projectile-profile.test.mjs
      - name: Build production application
        run: npm run build
