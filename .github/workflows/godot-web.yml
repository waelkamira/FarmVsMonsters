name: Godot Web local test build

on:
  push:
    branches: [main]
    paths:
      - "godot/**"
      - ".github/workflows/godot-web.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-web-local-build
  cancel-in-progress: true

jobs:
  build-local-browser:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Godot 4.4.1 and Web export templates
        uses: chickensoft-games/setup-godot@v1
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Import project resources
        run: godot --headless --editor --path godot --quit

      - name: Export browser build
        run: |
          mkdir -p build
          godot --headless --path godot --export-release "Web" build/index.html
          test -s build/index.html

      - name: Package local browser build
        run: |
          cp godot/WEB_BUILD.md build/README-WEB-LOCAL.txt
          cd build
          zip -r ../farm-vs-monsters-web-local.zip .

      - name: Upload downloadable browser build
        uses: actions/upload-artifact@v4
        with:
          name: farm-vs-monsters-web-local
          path: farm-vs-monsters-web-local.zip
          if-no-files-found: error
          retention-days: 14
