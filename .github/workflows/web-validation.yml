name: Web validation

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/web-validation.yml"
  pull_request:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/web-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, tests, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Focused battle HUD regression tests
        run: node --test --test-name-pattern="battle HUD controls use one evenly spaced|uploaded wood frame is loaded" tests/wood-frame-inventory.test.mjs

      - name: Production build
        run: npm run build

      - name: Full unit test suite
        run: npm test

  local-ai-worker:
    name: Local AI worker contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web/local-ai-worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install worker test dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate WSL launcher syntax
        run: bash -n setup-wsl.sh start-worker-wsl.sh

      - name: Compile worker
        run: python -m py_compile worker.py

      - name: Run worker contract tests
        run: python -m unittest -v test_worker.py
