name: Web validation

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/web-validation.yml"
  pull_request:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/web-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, tests, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

  local-ai-worker:
    name: Local AI worker contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web/local-ai-worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install worker test dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate WSL launcher syntax
        run: bash -n setup-wsl.sh start-worker-wsl.sh

      - name: Compile worker
        run: python -m py_compile worker.py

      - name: Run worker contract tests
        run: python -m unittest -v test_worker.py

  wan-worker-contract:
    name: Wan worker contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web/wan-worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight contract dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Compile worker and Colab launcher
        run: python -m py_compile worker.py colab_start.py
      - name: Run Wan worker contract tests
        run: python -m unittest -v test_worker.py

  ai-animation-studio:
    name: AI animation Studio checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        run: npm ci
      - name: Lint AI animation files
        run: npx eslint app/studio/ai-animation/page.js app/studio/ai-animation/PhaserSpritePreview.jsx app/api/studio/ai-animation/jobs/route.js app/api/studio/ai-animation/jobs/[jobId]/route.js app/api/studio/ai-animation/jobs/[jobId]/videos/[motionId]/route.js app/api/studio/ai-animation/jobs/[jobId]/files/[...filePath]/route.js app/api/studio/ai-animation/jobs/[jobId]/process/[motionId]/route.js app/api/studio/ai-animation/jobs/[jobId]/generate/route.js app/api/studio/ai-animation/jobs/[jobId]/sync/route.js app/api/studio/ai-animation/jobs/[jobId]/publish/route.js game/studio/aiAnimationPipeline.mjs
      - name: Run AI animation unit tests
        run: node --test tests/aiAnimationPipeline.test.mjs
